# Enable mouse emulation.
# CONFIG_ZMK_POINTING=y

# Change idle settings
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep settings (also enabled in the board defconfig; default timeout is 15 min)
CONFIG_ZMK_SLEEP=y
# Go to deep sleep after 1 hour idle (must be longer than CONFIG_ZMK_IDLE_TIMEOUT)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2400000

# Custom keyboard name (max. 16 characters)
# CONFIG_ZMK_KEYBOARD_NAME="My Keyboard"